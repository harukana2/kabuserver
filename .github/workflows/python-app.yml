name: US Stock Scan

on:
  schedule:
    # 平日 22:30 UTC = 日本時間 翌7:30 (米国市場クローズ後)。必要に応じて調整
    - cron: "30 22 * * 1-5"
  repository_dispatch:
    types: [run-screener]
  workflow_dispatch: {}  # 手動実行用ボタン

permissions:
  contents: write  # data/ フォルダへのコミットに必要

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade webull-openapi-python-sdk pandas numpy requests yfinance

      - name: Run scan
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python us_stock_scanner_webull_openapi.py

      - name: Commit and push results
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update scan data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push

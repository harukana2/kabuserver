name: US Stock Scan

on:
  schedule:
    # 平日 22:30 UTC = 日本時間 翌7:30 (米国市場クローズ後)。必要に応じて調整
    - cron: "30 22 * * 1-5"
  repository_dispatch:
    types: [run-screener]
  workflow_dispatch:  # 手動実行用ボタン(デバッグ高速化パラメータ付き)
    inputs:
      universe_limit:
        description: "スキャン対象を先頭N銘柄に制限(空欄なら全銘柄)"
        required: false
        default: ""
      skip_sp500:
        description: "S&P500全銘柄の無条件ファンダメンタルズ取得をスキップする"
        type: boolean
        required: false
        default: false
      fundamentals_top_n:
        description: "ファンダメンタルズ取得の対象件数(空欄なら通常の40)"
        required: false
        default: ""
      sp500_top_n:
        description: "S&P500からファンダメンタルズ取得する上限件数(空欄なら通常の60)"
        required: false
        default: ""
      sim_reset:
        description: "シミュレーションをリセットする(保有株・取引履歴・現金残高を全て破棄して最初からやり直す)"
        type: boolean
        required: false
        default: false
      sim_initial_cash:
        description: "リセット時の初期資金(空欄なら前回値、前回もなければ$100)"
        required: false
        default: ""
      sim_reset_learning:
        description: "学習データ(的中率の学習)も一緒にリセットする"
        type: boolean
        required: false
        default: false
      sim_reset_rl:
        description: "強化学習モデル(rl_model.pkl)もリセットする(ゼロから学習し直す)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write  # data/ フォルダへのコミットに必要

concurrency:
  group: stock-scan
  cancel-in-progress: false  # 実行中に次のスキャンが始まらないようにする

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # shallow cloneだとpull --rebaseが不安定になるためfull historyを取得

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --upgrade webull-openapi-python-sdk pandas numpy requests yfinance scikit-learn

      - name: Run scan
        env:
          WEBULL_APP_KEY: ${{ secrets.WEBULL_APP_KEY }}
          WEBULL_APP_SECRET: ${{ secrets.WEBULL_APP_SECRET }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          SCAN_UNIVERSE_LIMIT: ${{ github.event.inputs.universe_limit }}
          SCAN_SKIP_SP500: ${{ github.event.inputs.skip_sp500 }}
          SCAN_FUNDAMENTALS_TOP_N: ${{ github.event.inputs.fundamentals_top_n }}
          SCAN_SP500_TOP_N: ${{ github.event.inputs.sp500_top_n }}
          SIM_RESET: ${{ github.event.inputs.sim_reset }}
          SIM_INITIAL_CASH: ${{ github.event.inputs.sim_initial_cash }}
          SIM_RESET_LEARNING: ${{ github.event.inputs.sim_reset_learning }}
          SIM_RESET_RL: ${{ github.event.inputs.sim_reset_rl }}
        run: python us_stock_scanner_webull_openapi.py

      - name: Commit and push results
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet && exit 0

          git commit -m "chore: update scan data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # pushの直前にリモートの最新を取り込む(他の実行やREADME更新等との
          # 衝突で 'fetch first' で弾かれるのを防ぐ)。data/はスクリプトが
          # 追記するだけのファイル群なのでrebaseでの衝突は基本発生しない想定。
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "[warn] push失敗。リトライします ($i/5)"
            sleep $((RANDOM % 10 + 5))
          done

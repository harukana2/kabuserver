<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米国株スキャナー | 結果ビューア</title>
<style>
  :root{
    --bg:#f6f8fa;
    --card:#ffffff;
    --line:#e3e7eb;
    --text:#202124;
    --muted:#5f6368;
    --accent:#1a73e8;
    --up:#188038;
    --down:#c5221f;
    --opp:#c5221f;
    --risk:#8430ce;
    --chip-bg:#f1f3f4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  header{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:16px 20px;
    position:sticky; top:0; z-index:10;
  }
  header .row1{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  header h1{
    font-size:17px; font-weight:600; margin:0; color:var(--text);
  }
  header .meta{color:var(--muted); font-size:12.5px;}
  .controls{
    display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;
  }
  select, input[type=text]{
    background:#fff;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 12px;
    font-family:inherit;
    font-size:13px;
    border-radius:8px;
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .dirbtn{
    background:#fff; border:1px solid var(--line); color:var(--text);
    padding:7px 12px; border-radius:8px; font-size:12.5px; cursor:pointer;
  }
  .dirbtn:hover{background:var(--chip-bg);}
  .tabs{
    display:flex; gap:4px; margin-top:14px; border-bottom:1px solid var(--line);
  }
  .tab{
    padding:10px 16px; cursor:pointer; color:var(--muted);
    font-size:13.5px; font-weight:500;
    border-bottom:2px solid transparent; user-select:none;
  }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .sortbar{
    display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:12.5px;
  }
  main{max-width:760px; margin:0 auto; padding:16px 14px 60px;}
  .status{color:var(--muted); padding:60px 0; text-align:center;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .card-top{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px;
  }
  .sym{font-size:17px; font-weight:700; color:var(--text);}
  .price{font-size:15px; color:var(--muted);}
  .chg{font-weight:600; font-size:13.5px;}
  .chg.pos{color:var(--up);} .chg.neg{color:var(--down);}
  .scores{margin-left:auto; display:flex; gap:8px;}
  .badge{
    padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge.opp{background:#fce8e6; color:var(--opp);}
  .badge.risk{background:#f3e8fd; color:var(--risk);}
  .badge.pred{background:#f1f3f4;}
  .accuracy-line{margin-top:8px; font-size:12px; color:var(--muted);}
  .accuracy-line .hit{color:var(--down); font-weight:700;}
  .accuracy-line .miss{color:var(--accent); font-weight:700;}
  .analysis-controls{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;
  }
  .analysis-controls input[type=text]{flex:1; min-width:120px; text-transform:uppercase;}
  .scale-btn{
    background:#fff; border:1px solid var(--line); color:var(--text);
    padding:7px 14px; border-radius:8px; font-size:12.5px; cursor:pointer;
  }
  .scale-btn.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  .go-btn{
    background:var(--accent); color:#fff; border:none;
    padding:8px 16px; border-radius:8px; font-size:13px; cursor:pointer;
  }
  #analysisChart{width:100%; height:260px; display:block; background:var(--card); border:1px solid var(--line); border-radius:12px;}
  .analysis-title{font-size:15px; font-weight:700; margin:16px 0 8px;}
  .stat-row{
    display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:10px;
  }
  .chip{
    background:var(--chip-bg); color:var(--text);
    padding:4px 10px; border-radius:6px; font-size:12px; white-space:nowrap;
  }
  .chip .lbl{color:var(--muted); margin-right:4px;}
  .notes{margin-top:12px;}
  .note-line{margin-bottom:6px; font-size:13px;}
  .note-line .lbl{
     min-width:76px; font-weight:700; font-size:12px; margin-bottom:2px;
  }
  .lbl.situation{ color:#1a73e8; }
  .lbl.outlook{ color:#c5221f; }
  .lbl.timing{ color:#188038; }
  .earnings{
    margin-top:10px; font-size:12px; color:var(--muted);
  }
  footer{
    max-width:760px; margin:0 auto; padding:16px 14px 50px;
    color:var(--muted); font-size:11.5px; border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <div class="row1">
    <h1>米国株スキャナー結果</h1>
    <span class="meta" id="metaInfo">読み込み中…</span>
    <div class="controls">
      <select id="dateSelect"></select>
      <input type="text" id="filterBox" placeholder="銘柄フィルタ (例: AAPL)">
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="day_trade">デイトレード候補</div>
    <div class="tab" data-tab="long_term">長期・成長期待候補</div>
    <div class="tab" data-tab="major">S&amp;P500など主要企業</div>
    <div class="tab" data-tab="analysis">分析</div>
  </div>
  <div class="sortbar" id="sortbarWrap">
    並び替え:
    <select id="sortSelect"></select>
    <button id="dirToggle" type="button" class="dirbtn">▼ 降順</button>
  </div>
</header>

<main>
  <div id="statusMsg" class="status">データを読み込んでいます…</div>
  <div id="cardsWrap"></div>

  <div id="analysisPanel" style="display:none;">
    <div class="analysis-controls">
      <input type="text" id="analysisSymbol" placeholder="銘柄コード (例: AAPL)">
      <button class="scale-btn active" data-scale="1d" type="button">1日</button>
      <button class="scale-btn" data-scale="5d" type="button">5日</button>
      <button class="scale-btn" data-scale="1m" type="button">1か月</button>
      <button class="go-btn" id="analysisGoBtn" type="button">表示</button>
    </div>
    <canvas id="analysisChart"></canvas>
    <div class="analysis-title">過去の予想と的中判定</div>
    <div id="analysisPredictions"></div>
  </div>
</main>

<footer>
  データ出典: 価格・出来高・テクニカル指標はWebull OpenAPI、ファンダメンタルズはyfinance。
  スコア・コメントはルールベースの目安であり、投資助言ではありません。
</footer>

<script>
const DATA_DIR = "data"; // docs/data/ (index.htmlと同じdocsフォルダ内)

const SORT_OPTIONS = {
  day_trade: [
    {key:"day_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"day_risk", label:"リスクスコア", dir:"desc"},
    {key:"day_timing_score", label:"タイミングの良さ(利益期待-リスク)", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"day_change_pct", label:"前日比", dir:"desc"},
    {key:"rel_volume", label:"相対出来高", dir:"desc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
  long_term: [
    {key:"long_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"long_risk", label:"リスクスコア", dir:"desc"},
    {key:"long_timing_score", label:"タイミングの良さ(利益期待-リスク)", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"mom_3m", label:"3ヶ月騰落率", dir:"desc"},
    {key:"per", label:"PER", dir:"asc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
  major: [
    {key:"long_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"day_change_pct", label:"前日比", dir:"desc"},
    {key:"mom_3m", label:"3ヶ月騰落率", dir:"desc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
};

let sortDir = "desc"; // 現在の並び替え方向(ボタンで昇順/降順を独立トグル)

const PREDICTION_META = {
  "大きく値上がり": {color:"#c5221f", bg:"#fce8e6", icon:"↑↑"},
  "少し値上がり":   {color:"#e8710a", bg:"#fef2e0", icon:"↑"},
  "変動なし":       {color:"#5f6368", bg:"#f1f3f4", icon:"→"},
  "少し値下がり":   {color:"#1a73e8", bg:"#e8f0fe", icon:"↓"},
  "大きく値下がり": {color:"#0b3d91", bg:"#e3e9fb", icon:"↓↓"},
};

function predBadge(category){
  if(!category) return "";
  const m = PREDICTION_META[category] || {color:"#5f6368", bg:"#f1f3f4", icon:""};
  return `<span class="badge pred" style="background:${m.bg};color:${m.color};">予想 ${m.icon} ${category}</span>`;
}

// --- 予想ログ・株価履歴(分析タブ・的中表示用) ---
let predictionsLogCache = null;
const symbolHistoryCache = {};
const symbolIntradayCache = {};

async function loadPredictionsLog(){
  if(predictionsLogCache) return predictionsLogCache;
  try{
    const res = await fetch(`${DATA_DIR}/predictions_log.json`, {cache:"no-store"});
    if(!res.ok){ predictionsLogCache = {entries:[]}; return predictionsLogCache; }
    const text = await res.text();
    predictionsLogCache = text.trim() ? JSON.parse(text) : {entries:[]};
  }catch(e){ predictionsLogCache = {entries:[]}; }
  return predictionsLogCache;
}

async function loadSymbolHistory(sym){
  if(symbolHistoryCache[sym]) return symbolHistoryCache[sym];
  try{
    const res = await fetch(`${DATA_DIR}/history/${sym}.json`, {cache:"no-store"});
    if(!res.ok){ symbolHistoryCache[sym] = []; return []; }
    const text = await res.text();
    symbolHistoryCache[sym] = text.trim() ? JSON.parse(text) : [];
  }catch(e){ symbolHistoryCache[sym] = []; }
  return symbolHistoryCache[sym];
}

async function loadSymbolIntraday(sym){
  if(symbolIntradayCache[sym]) return symbolIntradayCache[sym];
  try{
    const res = await fetch(`${DATA_DIR}/intraday/${sym}.json`, {cache:"no-store"});
    if(!res.ok){ symbolIntradayCache[sym] = null; return null; }
    const text = await res.text();
    symbolIntradayCache[sym] = text.trim() ? JSON.parse(text) : null;
  }catch(e){ symbolIntradayCache[sym] = null; }
  return symbolIntradayCache[sym];
}

// 予想が「的中」したかを判定する。
// 値上がり予想: 期間中の終値が1度でも予想時の価格を上回ればOK(上昇率を赤で表示)。
// 値下がり予想: 期間中の終値が1度でも予想時の価格を下回ればOK(下落率を赤で表示)。
// 外した場合は、期間中の最良ケースでの乖離率を青で表示する。
// 変動なし予想: 期間中の乖離幅が±3%以内に収まっていれば的中。
function judgePrediction(entry, hist){
  const p0 = entry.price_at_prediction;
  if(p0 === null || p0 === undefined || !hist || hist.length === 0) return null;
  const windowPts = hist.filter(h => h.date >= entry.made_date && h.date <= entry.horizon_end);
  if(windowPts.length === 0) return null;

  const isUp = entry.category.includes("値上がり");
  const isDown = entry.category.includes("値下がり");
  let hit, movePct;
  if(isUp){
    const maxClose = Math.max(...windowPts.map(h=>h.close));
    movePct = (maxClose - p0) / p0 * 100;
    hit = movePct > 0;
  } else if(isDown){
    const minClose = Math.min(...windowPts.map(h=>h.close));
    movePct = (minClose - p0) / p0 * 100;
    hit = movePct < 0;
  } else {
    const maxAbsPct = Math.max(...windowPts.map(h => Math.abs((h.close - p0) / p0 * 100)));
    movePct = maxAbsPct;
    hit = maxAbsPct < 3;
  }
  const todayStr = new Date().toISOString().slice(0,10);
  const resolved = entry.horizon_end <= todayStr;
  return {hit, movePct, resolved};
}

function accuracyChipHtml(j){
  if(!j) return `<span class="accuracy-line">判定材料が集まり次第、的中結果を表示します</span>`;
  const sign = j.movePct >= 0 ? "+" : "";
  if(j.hit){
    return `<span class="accuracy-line">前回予想: <span class="hit">的中 (${sign}${j.movePct.toFixed(1)}%)</span>${j.resolved?"":" ・判定期間中"}</span>`;
  }
  return `<span class="accuracy-line">前回予想: <span class="miss">未達 (${sign}${j.movePct.toFixed(1)}%)</span>${j.resolved?"":" ・判定期間中"}</span>`;
}

// カード内に「前回予想の的中判定」を非同期で差し込む
async function attachAccuracy(elId, symbol, kind){
  const log = await loadPredictionsLog();
  const entries = log.entries.filter(e => e.symbol === symbol && e.kind === kind);
  if(entries.length === 0) return;
  entries.sort((a,b)=> b.made_at.localeCompare(a.made_at));
  const latest = entries[0];
  const hist = await loadSymbolHistory(symbol);
  const j = judgePrediction(latest, hist);
  const el = document.getElementById(elId);
  if(el) el.innerHTML = accuracyChipHtml(j);
}

let currentTab = "day_trade";
let currentData = null;
let sortKey = "day_opportunity";

function fmtUsd(v){ return (v===null||v===undefined) ? "—" : "$"+Number(v).toFixed(2); }
function fmtPct(v){
  if(v===null||v===undefined) return "—";
  const n = Number(v);
  return (n>=0?"+":"") + n.toFixed(2) + "%";
}
function fmtRatio(v){ return (v===null||v===undefined) ? "—" : Number(v).toFixed(1)+"倍"; }
function fmtNum(v, d=0){ return (v===null||v===undefined) ? "—" : Number(v).toFixed(d); }

async function loadIndex(){
  const res = await fetch(`${DATA_DIR}/index.json`, {cache:"no-store"});
  if(!res.ok) throw new Error(`index.json の取得に失敗しました (HTTP ${res.status})`);
  const text = await res.text();
  if(!text.trim()) throw new Error("index.json が空です。スキャンをもう一度実行してください。");
  return JSON.parse(text);
}

async function loadSnapshot(file){
  const res = await fetch(`${DATA_DIR}/${file}`, {cache:"no-store"});
  if(!res.ok) throw new Error(`${file} の取得に失敗しました (HTTP ${res.status})`);
  const text = await res.text();
  if(!text.trim()) throw new Error(`${file} が空です。`);
  return JSON.parse(text);
}

function cardDayTrade(r){
  const chgCls = (r.day_change_pct||0) >= 0 ? "pos" : "neg";
  const accId = `acc-day-${r.symbol}`;
  return `
  <div class="card">
    <div class="card-top">
      <span class="sym">${r.symbol}</span>
      <span class="price">${fmtUsd(r.price)}</span>
      <span class="chg ${chgCls}">${fmtPct(r.day_change_pct)}</span>
      <div class="scores">
        <span class="badge opp">利益期待 ${fmtNum(r.day_opportunity)}</span>
        <span class="badge risk">リスク ${fmtNum(r.day_risk)}</span>
      </div>
    </div>
    <div class="stat-row">
      <span class="chip"><span class="lbl">ATR</span>${fmtNum(r.atr_pct,1)}%</span>
      <span class="chip"><span class="lbl">相対出来高</span>${fmtNum(r.rel_volume,2)}x</span>
      <span class="chip"><span class="lbl">RSI14</span>${fmtNum(r.rsi14)}</span>
      ${predBadge(r.day_prediction)}
    </div>
    <div class="notes">
      <div class="note-line"><span class="lbl situation">現状</span><br>${r.day_situation||"—"}</div>
      <div class="note-line"><span class="lbl outlook">見立て</span><br>${r.day_outlook||"—"}</div>
      <div class="note-line"><span class="lbl timing">タイミング</span><br>${r.day_timing||"—"}</div>
    </div>
    <div id="${accId}"></div>
    <div class="earnings">次回決算: ${r.next_earnings||"不明"}</div>
  </div>`;
}

function cardLongTerm(r, showScore){
  const scoreHtml = showScore ? `
      <div class="scores">
        <span class="badge opp">利益期待 ${fmtNum(r.long_opportunity)}</span>
        <span class="badge risk">リスク ${fmtNum(r.long_risk)}</span>
      </div>` : `
      <div class="scores"><span class="badge opp">利益期待 ${fmtNum(r.long_opportunity)}</span></div>`;
  const accId = `acc-long-${r.symbol}`;
  return `
  <div class="card">
    <div class="card-top">
      <span class="sym">${r.symbol}</span>
      <span class="price">${fmtUsd(r.price)}</span>
      <span class="chg ${(r.mom_3m||0)>=0?'pos':'neg'}">3ヶ月 ${fmtPct(r.mom_3m)}</span>
      ${scoreHtml}
    </div>
    <div class="stat-row">
      <span class="chip"><span class="lbl">200日線</span>${r.above_sma200 ? "上" : "下"}</span>
      <span class="chip"><span class="lbl">PER</span>${fmtRatio(r.per)}</span>
      <span class="chip"><span class="lbl">PBR</span>${fmtRatio(r.pbr)}</span>
      <span class="chip"><span class="lbl">ネットキャッシュ比率</span>${fmtPct(r.net_cash_ratio)}</span>
      <span class="chip"><span class="lbl">セクター</span>${r.sector||"—"}</span>
      ${predBadge(r.long_prediction)}
    </div>
    <div class="notes">
      <div class="note-line"><span class="lbl situation">現状</span><br>${r.long_situation||"—"}</div>
      <div class="note-line"><span class="lbl outlook">見立て</span><br>${r.long_outlook||"—"}</div>
      <div class="note-line"><span class="lbl timing">タイミング</span><br>${r.long_timing||"—"}</div>
    </div>
    <div id="${accId}"></div>
    <div class="earnings">次回決算: ${r.next_earnings||"不明"}</div>
  </div>`;
}

function renderCards(){
  const rows0 = (currentData[currentTab] || []);
  const filterVal = document.getElementById("filterBox").value.trim().toUpperCase();
  let rows = filterVal ? rows0.filter(r => (r.symbol||"").toUpperCase().includes(filterVal)) : rows0.slice();

  // 計算フィールド: タイミングの良さ = 利益期待スコア - リスクスコア(簡易指標)
  rows = rows.map(r => ({
    ...r,
    day_timing_score: (r.day_opportunity ?? null) !== null && (r.day_risk ?? null) !== null
      ? r.day_opportunity - r.day_risk : null,
    long_timing_score: (r.long_opportunity ?? null) !== null && (r.long_risk ?? null) !== null
      ? r.long_opportunity - r.long_risk : null,
  }));

  rows.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(av===null||av===undefined) av = sortDir==="asc" ? Infinity : -Infinity;
    if(bv===null||bv===undefined) bv = sortDir==="asc" ? Infinity : -Infinity;
    if(typeof av === "string" || typeof bv === "string"){
      av = String(av); bv = String(bv);
      return sortDir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    return sortDir==="asc" ? av-bv : bv-av;
  });

  const wrap = document.getElementById("cardsWrap");
  if(rows.length === 0){
    wrap.innerHTML = `<div class="status">該当する銘柄がありません</div>`;
    return;
  }
  wrap.innerHTML = rows.map(r => {
    if(currentTab === "day_trade") return cardDayTrade(r);
    if(currentTab === "long_term") return cardLongTerm(r, true);
    return cardLongTerm(r, false);
  }).join("");

  // 各カードの「前回予想の的中判定」を非同期で読み込んで差し込む
  rows.forEach(r => {
    if(!r.symbol) return;
    if(currentTab === "day_trade"){
      attachAccuracy(`acc-day-${r.symbol}`, r.symbol, "day");
    } else {
      attachAccuracy(`acc-long-${r.symbol}`, r.symbol, "long");
    }
  });
}

function updateDirButton(){
  const btn = document.getElementById("dirToggle");
  btn.textContent = sortDir === "desc" ? "▼ 降順" : "▲ 昇順";
}

function populateSortSelect(){
  const sel = document.getElementById("sortSelect");
  sel.innerHTML = SORT_OPTIONS[currentTab].map(o => `<option value="${o.key}">${o.label}</option>`).join("");
  const first = SORT_OPTIONS[currentTab][0];
  sortKey = first.key;
  sortDir = first.dir;
  sel.value = sortKey;
  updateDirButton();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===tab));

  const isAnalysis = tab === "analysis";
  document.getElementById("sortbarWrap").style.display = isAnalysis ? "none" : "flex";
  document.getElementById("cardsWrap").style.display = isAnalysis ? "none" : "";
  document.getElementById("analysisPanel").style.display = isAnalysis ? "block" : "none";
  document.getElementById("statusMsg").style.display = "none";

  if(isAnalysis){
    if(analysisSymbol) runAnalysis(analysisSymbol, analysisScale);
    return;
  }
  populateSortSelect();
  renderCards();
}

// --------------------------------------------------------------------------
// 分析タブ: 指定銘柄の株価推移 + 予想・的中判定
// --------------------------------------------------------------------------
let analysisSymbol = "";
let analysisScale = "1d";

function fmtChartLabel(dateStr){
  // "2026-09-16" -> "09/16"
  const parts = (dateStr||"").split("-");
  return parts.length === 3 ? `${parts[1]}/${parts[2]}` : (dateStr||"");
}

async function runAnalysis(sym, scale){
  sym = sym.toUpperCase().trim();
  if(!sym) return;
  analysisSymbol = sym;
  analysisScale = scale;
  document.getElementById("analysisSymbol").value = sym;
  document.querySelectorAll(".scale-btn").forEach(b => b.classList.toggle("active", b.dataset.scale===scale));

  const chartWrap = document.getElementById("analysisChart");
  const predWrap = document.getElementById("analysisPredictions");
  predWrap.innerHTML = `<div class="status">読み込み中…</div>`;

  const hist = await loadSymbolHistory(sym);
  let points = [];

  if(scale === "1d"){
    const intraday = await loadSymbolIntraday(sym);
    if(intraday && intraday.points && intraday.points.length > 0){
      points = intraday.points.map(p => ({label:p.t, price:p.price}));
    }
  } else if(scale === "5d"){
    points = hist.slice(-5).map(h => ({label:fmtChartLabel(h.date), price:h.close}));
  } else {
    points = hist.slice(-22).map(h => ({label:fmtChartLabel(h.date), price:h.close}));
  }

  drawAnalysisChart(points, sym);

  const log = await loadPredictionsLog();
  const entries = log.entries.filter(e => e.symbol === sym);
  renderAnalysisPredictions(entries, hist);
}

function drawAnalysisChart(points, sym){
  const canvas = document.getElementById("analysisChart");
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 600;
  const cssH = 260;
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  if(!points || points.length < 2){
    ctx.fillStyle = "#5f6368";
    ctx.font = "13px sans-serif";
    ctx.fillText(`${sym||''} のデータがまだありません(スキャンの蓄積をお待ちください)`, 12, cssH/2);
    return;
  }

  const prices = points.map(p=>p.price);
  const min = Math.min(...prices), max = Math.max(...prices);
  const pad = (max-min)*0.12 || Math.max(min*0.02, 0.5);
  const yMin = min-pad, yMax = max+pad;
  const left = 56, right = 16, top = 18, bottom = 28;
  const plotW = cssW - left - right;
  const plotH = cssH - top - bottom;
  const xStep = points.length > 1 ? plotW/(points.length-1) : 0;

  const xAt = i => left + i*xStep;
  const yAt = v => top + plotH * (1 - (v - yMin)/(yMax - yMin || 1));

  // 折れ線
  ctx.strokeStyle = "#1a73e8";
  ctx.lineWidth = 2;
  ctx.beginPath();
  points.forEach((p,i) => {
    const x = xAt(i), y = yAt(p.price);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();

  // 軸ラベル
  ctx.fillStyle = "#5f6368";
  ctx.font = "11px sans-serif";
  ctx.fillText(fmtUsd(yMax), 4, top+8);
  ctx.fillText(fmtUsd(yMin), 4, top+plotH);
  const labelStep = Math.max(1, Math.ceil(points.length/6));
  points.forEach((p,i) => {
    if(i % labelStep === 0 || i === points.length-1){
      ctx.fillText(p.label, Math.min(xAt(i)-14, cssW-right-30), cssH-8);
    }
  });
}

function renderAnalysisPredictions(entries, hist){
  const wrap = document.getElementById("analysisPredictions");
  if(!entries || entries.length === 0){
    wrap.innerHTML = `<div class="status">この銘柄の過去の予想はまだありません</div>`;
    return;
  }
  entries = entries.slice().sort((a,b) => b.made_at.localeCompare(a.made_at));
  wrap.innerHTML = entries.map(e => {
    const j = judgePrediction(e, hist);
    const meta = PREDICTION_META[e.category] || {color:"#5f6368"};
    let resultHtml = `<span style="color:#5f6368;">判定材料が集まり次第、結果を表示します</span>`;
    if(j){
      const sign = j.movePct >= 0 ? "+" : "";
      resultHtml = j.hit
        ? `<span class="hit">的中 (${sign}${j.movePct.toFixed(1)}%)</span>`
        : `<span class="miss">未達 (${sign}${j.movePct.toFixed(1)}%)</span>`;
      if(!j.resolved) resultHtml += ` <span style="color:#5f6368;">・判定期間中(〜${e.horizon_end})</span>`;
    }
    return `<div class="card" style="padding:12px 16px;margin-bottom:8px;">
      <div style="font-size:12px;color:var(--muted);">
        ${e.made_date}時点 (${e.kind==='day'?'短期・1〜5営業日':'長期・1〜3ヶ月'}) ／ 予想時株価 ${fmtUsd(e.price_at_prediction)}
      </div>
      <div style="font-weight:700;color:${meta.color};margin-top:2px;">${e.category}</div>
      <div class="accuracy-line" style="margin-top:6px;">${resultHtml}</div>
    </div>`;
  }).join("");
}

async function init(){
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  document.getElementById("filterBox").addEventListener("input", renderCards);
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    sortKey = e.target.value;
    const opt = SORT_OPTIONS[currentTab].find(o => o.key === sortKey);
    sortDir = opt ? opt.dir : "desc";
    updateDirButton();
    renderCards();
  });
  document.getElementById("dirToggle").addEventListener("click", () => {
    sortDir = sortDir === "desc" ? "asc" : "desc";
    updateDirButton();
    renderCards();
  });
  populateSortSelect();

  // 分析タブ操作
  document.querySelectorAll(".scale-btn").forEach(btn => {
    btn.addEventListener("click", () => runAnalysis(analysisSymbol || document.getElementById("analysisSymbol").value, btn.dataset.scale));
  });
  document.getElementById("analysisGoBtn").addEventListener("click", () => {
    runAnalysis(document.getElementById("analysisSymbol").value, analysisScale);
  });
  document.getElementById("analysisSymbol").addEventListener("keydown", (e) => {
    if(e.key === "Enter") runAnalysis(e.target.value, analysisScale);
  });

  try{
    const index = await loadIndex();
    const select = document.getElementById("dateSelect");
    select.innerHTML = index.snapshots.map(s => `<option value="${s.file}">${s.generated_at_jst}</option>`).join("");

    select.addEventListener("change", async () => {
      currentData = await loadSnapshot(select.value);
      updateMeta();
      renderCards();
    });

    if(index.snapshots.length === 0){
      document.getElementById("statusMsg").textContent = "まだスキャン結果がありません。";
      return;
    }
    currentData = await loadSnapshot(index.snapshots[0].file);
    updateMeta();
    document.getElementById("statusMsg").style.display = "none";
    renderCards();

    // 分析タブのデフォルト銘柄(デイトレード候補の先頭)を設定
    const firstSym = (currentData.day_trade && currentData.day_trade[0] && currentData.day_trade[0].symbol)
      || (currentData.long_term && currentData.long_term[0] && currentData.long_term[0].symbol);
    if(firstSym){
      analysisSymbol = firstSym;
      document.getElementById("analysisSymbol").value = firstSym;
    }
  } catch(e){
    document.getElementById("statusMsg").textContent = "データの読み込みに失敗しました: " + e.message;
  }
}

function updateMeta(){
  document.getElementById("metaInfo").textContent =
    `ユニバース ${currentData.universe_size}銘柄 / データ取得成功 ${currentData.scanned_size}銘柄`;
}

init();
</script>

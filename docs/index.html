<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>米国株スキャナー | 結果ビューア</title>
<style>
  :root{
    --bg:#f6f8fa;
    --card:#ffffff;
    --line:#e3e7eb;
    --text:#202124;
    --muted:#5f6368;
    --accent:#1a73e8;
    --up:#188038;
    --down:#c5221f;
    --opp:#c5221f;
    --risk:#8430ce;
    --chip-bg:#f1f3f4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans JP",sans-serif;
    font-size:14px;
    line-height:1.6;
  }
  header{
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:16px 20px;
    position:sticky; top:0; z-index:10;
  }
  header .row1{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  }
  header h1{
    font-size:17px; font-weight:600; margin:0; color:var(--text);
  }
  header .meta{color:var(--muted); font-size:12.5px;}
  .controls{
    display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap;
  }
  select, input[type=text]{
    background:#fff;
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 12px;
    font-family:inherit;
    font-size:13px;
    border-radius:8px;
  }
  select:focus, input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .dirbtn{
    background:#fff; border:1px solid var(--line); color:var(--text);
    padding:7px 12px; border-radius:8px; font-size:12.5px; cursor:pointer;
  }
  .dirbtn:hover{background:var(--chip-bg);}
  .tabs{
    display:flex; gap:4px; margin-top:14px; border-bottom:1px solid var(--line);
  }
  .tab{
    padding:10px 16px; cursor:pointer; color:var(--muted);
    font-size:13.5px; font-weight:500;
    border-bottom:2px solid transparent; user-select:none;
  }
  .tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .sortbar{
    display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:12.5px;
  }
  main{max-width:760px; margin:0 auto; padding:16px 14px 60px;}
  .status{color:var(--muted); padding:60px 0; text-align:center;}
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .card-top{
    display:flex; align-items:center; flex-wrap:wrap; gap:10px 14px;
  }
  .sym{font-size:17px; font-weight:700; color:var(--text);}
  .price{font-size:15px; color:var(--muted);}
  .chg{font-weight:600; font-size:13.5px;}
  .chg.pos{color:var(--up);} .chg.neg{color:var(--down);}
  .scores{margin-left:auto; display:flex; gap:8px;}
  .badge{
    padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600;
  }
  .badge.opp{background:#fce8e6; color:var(--opp);}
  .badge.risk{background:#f3e8fd; color:var(--risk);}
  .stat-row{
    display:flex; flex-wrap:wrap; gap:6px 8px; margin-top:10px;
  }
  .chip{
    background:var(--chip-bg); color:var(--text);
    padding:4px 10px; border-radius:6px; font-size:12px; white-space:nowrap;
  }
  .chip .lbl{color:var(--muted); margin-right:4px;}
  .notes{margin-top:12px;}
  .note-line{margin-bottom:6px; font-size:13px;}
  .note-line .lbl{
     min-width:76px; font-weight:700; font-size:12px; margin-bottom:2px;
  }
  .lbl.situation{ color:#1a73e8; }
  .lbl.outlook{ color:#c5221f; }
  .lbl.timing{ color:#188038; }
  .earnings{
    margin-top:10px; font-size:12px; color:var(--muted);
  }
  footer{
    max-width:760px; margin:0 auto; padding:16px 14px 50px;
    color:var(--muted); font-size:11.5px; border-top:1px solid var(--line);
  }
</style>
</head>
<body>

<header>
  <div class="row1">
    <h1>米国株スキャナー結果</h1>
    <span class="meta" id="metaInfo">読み込み中…</span>
    <div class="controls">
      <select id="dateSelect"></select>
      <input type="text" id="filterBox" placeholder="銘柄フィルタ (例: AAPL)">
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="day_trade">デイトレード候補</div>
    <div class="tab" data-tab="long_term">長期・成長期待候補</div>
    <div class="tab" data-tab="major">S&amp;P500など主要企業</div>
  </div>
  <div class="sortbar">
    並び替え:
    <select id="sortSelect"></select>
    <button id="dirToggle" type="button" class="dirbtn">▼ 降順</button>
  </div>
</header>

<main>
  <div id="statusMsg" class="status">データを読み込んでいます…</div>
  <div id="cardsWrap"></div>
</main>

<footer>
  データ出典: 価格・出来高・テクニカル指標はWebull OpenAPI、ファンダメンタルズはyfinance。
  スコア・コメントはルールベースの目安であり、投資助言ではありません。
</footer>

<script>
const DATA_DIR = "data"; // docs/data/ (index.htmlと同じdocsフォルダ内)

const SORT_OPTIONS = {
  day_trade: [
    {key:"day_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"day_risk", label:"リスクスコア", dir:"desc"},
    {key:"day_timing_score", label:"タイミングの良さ(利益期待-リスク)", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"day_change_pct", label:"前日比", dir:"desc"},
    {key:"rel_volume", label:"相対出来高", dir:"desc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
  long_term: [
    {key:"long_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"long_risk", label:"リスクスコア", dir:"desc"},
    {key:"long_timing_score", label:"タイミングの良さ(利益期待-リスク)", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"mom_3m", label:"3ヶ月騰落率", dir:"desc"},
    {key:"per", label:"PER", dir:"asc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
  major: [
    {key:"long_opportunity", label:"利益期待スコア", dir:"desc"},
    {key:"price", label:"現在値", dir:"desc"},
    {key:"day_change_pct", label:"前日比", dir:"desc"},
    {key:"mom_3m", label:"3ヶ月騰落率", dir:"desc"},
    {key:"symbol", label:"銘柄名", dir:"asc"},
  ],
};

let sortDir = "desc"; // 現在の並び替え方向(ボタンで昇順/降順を独立トグル)

let currentTab = "day_trade";
let currentData = null;
let sortKey = "day_opportunity";

function fmtUsd(v){ return (v===null||v===undefined) ? "—" : "$"+Number(v).toFixed(2); }
function fmtPct(v){
  if(v===null||v===undefined) return "—";
  const n = Number(v);
  return (n>=0?"+":"") + n.toFixed(2) + "%";
}
function fmtRatio(v){ return (v===null||v===undefined) ? "—" : Number(v).toFixed(1)+"倍"; }
function fmtNum(v, d=0){ return (v===null||v===undefined) ? "—" : Number(v).toFixed(d); }

async function loadIndex(){
  const res = await fetch(`${DATA_DIR}/index.json`, {cache:"no-store"});
  if(!res.ok) throw new Error(`index.json の取得に失敗しました (HTTP ${res.status})`);
  const text = await res.text();
  if(!text.trim()) throw new Error("index.json が空です。スキャンをもう一度実行してください。");
  return JSON.parse(text);
}

async function loadSnapshot(file){
  const res = await fetch(`${DATA_DIR}/${file}`, {cache:"no-store"});
  if(!res.ok) throw new Error(`${file} の取得に失敗しました (HTTP ${res.status})`);
  const text = await res.text();
  if(!text.trim()) throw new Error(`${file} が空です。`);
  return JSON.parse(text);
}

function cardDayTrade(r){
  const chgCls = (r.day_change_pct||0) >= 0 ? "pos" : "neg";
  return `
  <div class="card">
    <div class="card-top">
      <span class="sym">${r.symbol}</span>
      <span class="price">${fmtUsd(r.price)}</span>
      <span class="chg ${chgCls}">${fmtPct(r.day_change_pct)}</span>
      <div class="scores">
        <span class="badge opp">利益期待 ${fmtNum(r.day_opportunity)}</span>
        <span class="badge risk">リスク ${fmtNum(r.day_risk)}</span>
      </div>
    </div>
    <div class="stat-row">
      <span class="chip"><span class="lbl">ATR</span>${fmtNum(r.atr_pct,1)}%</span>
      <span class="chip"><span class="lbl">相対出来高</span>${fmtNum(r.rel_volume,2)}x</span>
      <span class="chip"><span class="lbl">RSI14</span>${fmtNum(r.rsi14)}</span>
    </div>
    <div class="notes">
      <div class="note-line"><span class="lbl situation">現状</span><br>${r.day_situation||"—"}</div>
      <div class="note-line"><span class="lbl outlook">見立て</span><br>${r.day_outlook||"—"}</div>
      <div class="note-line"><span class="lbl timing">タイミング</span><br>${r.day_timing||"—"}</div>
    </div>
    <div class="earnings">次回決算: ${r.next_earnings||"不明"}</div>
  </div>`;
}

function cardLongTerm(r, showScore){
  const scoreHtml = showScore ? `
      <div class="scores">
        <span class="badge opp">利益期待 ${fmtNum(r.long_opportunity)}</span>
        <span class="badge risk">リスク ${fmtNum(r.long_risk)}</span>
      </div>` : `
      <div class="scores"><span class="badge opp">利益期待 ${fmtNum(r.long_opportunity)}</span></div>`;
  return `
  <div class="card">
    <div class="card-top">
      <span class="sym">${r.symbol}</span>
      <span class="price">${fmtUsd(r.price)}</span>
      <span class="chg ${(r.mom_3m||0)>=0?'pos':'neg'}">3ヶ月 ${fmtPct(r.mom_3m)}</span>
      ${scoreHtml}
    </div>
    <div class="stat-row">
      <span class="chip"><span class="lbl">200日線</span>${r.above_sma200 ? "上" : "下"}</span>
      <span class="chip"><span class="lbl">PER</span>${fmtRatio(r.per)}</span>
      <span class="chip"><span class="lbl">PBR</span>${fmtRatio(r.pbr)}</span>
      <span class="chip"><span class="lbl">ネットキャッシュ比率</span>${fmtPct(r.net_cash_ratio)}</span>
      <span class="chip"><span class="lbl">セクター</span>${r.sector||"—"}</span>
    </div>
    <div class="notes">
      <div class="note-line"><span class="lbl situation">現状</span><br>${r.long_situation||"—"}</div>
      <div class="note-line"><span class="lbl outlook">見立て</span><br>${r.long_outlook||"—"}</div>
      <div class="note-line"><span class="lbl timing">タイミング</span><br>${r.long_timing||"—"}</div>
    </div>
    <div class="earnings">次回決算: ${r.next_earnings||"不明"}</div>
  </div>`;
}

function renderCards(){
  const rows0 = (currentData[currentTab] || []);
  const filterVal = document.getElementById("filterBox").value.trim().toUpperCase();
  let rows = filterVal ? rows0.filter(r => (r.symbol||"").toUpperCase().includes(filterVal)) : rows0.slice();

  // 計算フィールド: タイミングの良さ = 利益期待スコア - リスクスコア(簡易指標)
  rows = rows.map(r => ({
    ...r,
    day_timing_score: (r.day_opportunity ?? null) !== null && (r.day_risk ?? null) !== null
      ? r.day_opportunity - r.day_risk : null,
    long_timing_score: (r.long_opportunity ?? null) !== null && (r.long_risk ?? null) !== null
      ? r.long_opportunity - r.long_risk : null,
  }));

  rows.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if(av===null||av===undefined) av = sortDir==="asc" ? Infinity : -Infinity;
    if(bv===null||bv===undefined) bv = sortDir==="asc" ? Infinity : -Infinity;
    if(typeof av === "string" || typeof bv === "string"){
      av = String(av); bv = String(bv);
      return sortDir==="asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    }
    return sortDir==="asc" ? av-bv : bv-av;
  });

  const wrap = document.getElementById("cardsWrap");
  if(rows.length === 0){
    wrap.innerHTML = `<div class="status">該当する銘柄がありません</div>`;
    return;
  }
  wrap.innerHTML = rows.map(r => {
    if(currentTab === "day_trade") return cardDayTrade(r);
    if(currentTab === "long_term") return cardLongTerm(r, true);
    return cardLongTerm(r, false);
  }).join("");
}

function updateDirButton(){
  const btn = document.getElementById("dirToggle");
  btn.textContent = sortDir === "desc" ? "▼ 降順" : "▲ 昇順";
}

function populateSortSelect(){
  const sel = document.getElementById("sortSelect");
  sel.innerHTML = SORT_OPTIONS[currentTab].map(o => `<option value="${o.key}">${o.label}</option>`).join("");
  const first = SORT_OPTIONS[currentTab][0];
  sortKey = first.key;
  sortDir = first.dir;
  sel.value = sortKey;
  updateDirButton();
}

function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab===tab));
  populateSortSelect();
  renderCards();
}

async function init(){
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
  document.getElementById("filterBox").addEventListener("input", renderCards);
  document.getElementById("sortSelect").addEventListener("change", (e) => {
    sortKey = e.target.value;
    const opt = SORT_OPTIONS[currentTab].find(o => o.key === sortKey);
    sortDir = opt ? opt.dir : "desc";
    updateDirButton();
    renderCards();
  });
  document.getElementById("dirToggle").addEventListener("click", () => {
    sortDir = sortDir === "desc" ? "asc" : "desc";
    updateDirButton();
    renderCards();
  });
  populateSortSelect();

  try{
    const index = await loadIndex();
    const select = document.getElementById("dateSelect");
    select.innerHTML = index.snapshots.map(s => `<option value="${s.file}">${s.generated_at_jst}</option>`).join("");

    select.addEventListener("change", async () => {
      currentData = await loadSnapshot(select.value);
      updateMeta();
      renderCards();
    });

    if(index.snapshots.length === 0){
      document.getElementById("statusMsg").textContent = "まだスキャン結果がありません。";
      return;
    }
    currentData = await loadSnapshot(index.snapshots[0].file);
    updateMeta();
    document.getElementById("statusMsg").style.display = "none";
    renderCards();
  } catch(e){
    document.getElementById("statusMsg").textContent = "データの読み込みに失敗しました: " + e.message;
  }
}

function updateMeta(){
  document.getElementById("metaInfo").textContent =
    `ユニバース ${currentData.universe_size}銘柄 / データ取得成功 ${currentData.scanned_size}銘柄`;
}

init();
</script>
</body>
</html>
